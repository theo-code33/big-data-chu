services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: eds-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: eds_ops
      CLICKHOUSE_USER: eds_admin
      CLICKHOUSE_PASSWORD: eds_admin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./lake:/var/lib/clickhouse/user_files/lake
      - ./sql:/sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "eds_admin", "--password", "eds_admin", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  metabase:
    image: metabase/metabase:v0.55.10
    container_name: eds-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Europe/Paris
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  pipeline:
    build: .
    container_name: eds-pipeline
    profiles: ["batch"]
    env_file: .env
    environment:
      SOURCE_FILESTORAGE: /data/source
      LAKE_ROOT: /app/lake
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_USER: eds_admin
      CLICKHOUSE_PASSWORD: eds_admin
    volumes:
      - ./lake:/app/lake
      - ./logs:/app/logs
      - ./sql:/app/sql:ro
      - ../source-filestorage:/data/source:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    command: python -m src.pipeline --all

  scheduler:
    build: .
    container_name: eds-scheduler
    profiles: ["auto"]
    env_file: .env
    environment:
      SOURCE_FILESTORAGE: /data/source
      LAKE_ROOT: /app/lake
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_USER: eds_admin
      CLICKHOUSE_PASSWORD: eds_admin
      SCHEDULER_INTERVAL_SEC: "60"
    volumes:
      - ./lake:/app/lake
      - ./logs:/app/logs
      - ./sql:/app/sql:ro
      - ../source-filestorage:/data/source:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    command: python -m src.scheduler
    restart: unless-stopped

volumes:
  clickhouse_data:
  metabase_data:
